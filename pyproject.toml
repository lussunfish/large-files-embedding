[project]
name = "large-files-embedding"
version = "0.1.0"
description = "시장품질 문서(PDF/DOCX/DOC/XLSX/XLS/CSV/PPTX/PPT)를 입고하고 Grok MCP로 조회하는 로컬 서비스"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "docling[rapidocr]>=2.0",
    "pymilvus>=2.5",
    "httpx>=0.27",
    "minio>=7.2",
    "polars>=1.20",
    "fastexcel>=0.12",
    "python-calamine>=0.3",
    "pymysql>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".grok", "init", "scripts/new-project.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = false

[[tool.mypy.overrides]]
module = [
    "uvicorn",
    "uvicorn.*",
    "docling",
    "docling.*",
    "docling_core",
    "docling_core.*",
    "pymilvus",
    "pymilvus.*",
    "minio",
    "minio.*",
    "fastexcel",
    "fastexcel.*",
    "python_calamine",
    "python_calamine.*",
    "pymysql",
    "pymysql.*",
    "pptx",
    "pptx.*",
    "pypdfium2",
    "pypdfium2.*",
]
ignore_missing_imports = true
